[platformio]
default_envs = fitness
extra_configs = platformio.local.ini

[papwick]
version = 0.1.0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DPAPWICK_VERSION=\"${papwick.version}\"

lib_deps = m5stack/M5Unified@^0.3.0

[env:fitness]
extends = base

[env:probe]
extends = base
build_src_filter = -<*> +<../examples/probe/>
